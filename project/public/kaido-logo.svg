<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="kaidoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F3BA2F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3BA2F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main logo circle -->
  <circle cx="20" cy="20" r="18" fill="url(#kaidoGradient)" stroke="#F3BA2F" stroke-width="2"/>
  
  <!-- Inner geometric pattern representing prediction/analytics -->
  <g transform="translate(20, 20)">
    <!-- Central diamond -->
    <polygon points="0,-8 6,0 0,8 -6,0" fill="#000000" opacity="0.8"/>
    
    <!-- Prediction arrows -->
    <path d="M-10,-6 L-4,-6 L-6,-4 M-4,-6 L-6,-8" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M10,6 L4,6 L6,4 M4,6 L6,8" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Data points -->
    <circle cx="-8" cy="2" r="1.5" fill="#000000"/>
    <circle cx="8" cy="-2" r="1.5" fill="#000000"/>
    <circle cx="0" cy="-12" r="1" fill="#000000"/>
    <circle cx="0" cy="12" r="1" fill="#000000"/>
  </g>
  
  <!-- KAIDO text -->
  <text x="45" y="16" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#textGradient)">KAIDO</text>
  <text x="45" y="28" font-family="Arial, sans-serif" font-size="8" fill="#F3BA2F" opacity="0.8">PREDICTIONS</text>
</svg>
